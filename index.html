  <dialog id="help-dialog"><button class="dialog-close" aria-label="关闭课堂说明">×</button><p class="eyebrow">课堂使用说明</p><h2>先观察，再作出判断。</h2><p>选择左侧活动，在右侧依次完成预测、验证、证据和解释。预测可以修正，不需要输入文字。</p><p>三维模型可以拖动旋转、滚轮缩放；用模型下方按钮切换部件、剖视或拆解。八关实践保留原有玩法、三种递进任务和操作演示。</p><p>学习记录保存在当前浏览器，可导出 JSON 备份并恢复。飞行成绩、课堂发现分别记录。教学模型和虚拟空域不用于真实飞行操作。</p><button class="primary" id="close-help">开始探索</button></dialog>
